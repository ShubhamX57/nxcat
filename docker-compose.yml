# Local stack: PostgreSQL, the nxcat API and the web app.
# Open http://localhost:8080 for the app (the API docs are also on :8000).
# Credentials here are for local development only.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: nxcat
      POSTGRES_PASSWORD: nxcat
      POSTGRES_DB: nxcat
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nxcat -d nxcat"]
      interval: 2s
      timeout: 5s
      retries: 15

  api:
    build: ./backend
    environment:
      NXCAT_DATABASE_URL: postgresql+psycopg://nxcat:nxcat@db:5432/nxcat
      NXCAT_DATA_ROOT: /data
    # Login settings for write actions (see .env.example). Optional: without a
    # .env file the API still starts, read-only.
    env_file:
      - path: .env
        required: false
    # Lets the API reach a model server on your computer (e.g. Ollama) as
    # host.docker.internal. Docker Desktop provides this name already; Linux needs it.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - nxcat-files:/data  # NeXus files the API can read (e.g. for previews)
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
  nxcat-files:
