# Local stack: PostgreSQL and the nxcat API. The web app is added later.
# Credentials here are for local development only.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: nxcat
      POSTGRES_PASSWORD: nxcat
      POSTGRES_DB: nxcat
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nxcat -d nxcat"]
      interval: 2s
      timeout: 5s
      retries: 15

  api:
    build: ./backend
    environment:
      NXCAT_DATABASE_URL: postgresql+psycopg://nxcat:nxcat@db:5432/nxcat
    ports:
      - "8000:8000"
    volumes:
      - nxcat-files:/data  # NeXus files the API can read (e.g. for previews)
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  nxcat-files:
