[project]
name = "nxcat"
version = "0.0.1"
description = "A mini metadata catalogue for neutron data"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "h5py>=3.16.0",
    "numpy>=2.5.4",
    "psycopg[binary]>=3.2",
    "pydantic>=2.14.1",
    "pyjwt>=2.9",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
nxcat-generate = "nxcat.synthetic:main"
nxcat-ingest = "nxcat.ingest.pipeline:main"
nxcat-hash-password = "nxcat.security:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx2>=2.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nxcat"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["nxcat"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]  # assert, fake passwords and seeded random are fine in tests
"src/nxcat/synthetic.py" = ["S311"]  # seeded random on purpose: reproducible fake data, not secrets

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["h5py", "h5py.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["nxcat"]
branch = true
