name: Publish images

# Builds the API and web images and publishes them to GitHub Container Registry
# (ghcr.io), where they appear under "Packages" on the repository page.
#
# Runs when a version tag such as v0.2.0 is pushed. It can also be started by hand
# (Actions > Publish images > Run workflow) for a tag that already exists.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to publish, e.g. v0.1.0"
        required: true

permissions:
  contents: read
  packages: write # needed to push to ghcr.io with the built-in GITHUB_TOKEN

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: nxcat-api
            context: backend
          - image: nxcat-web
            context: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # arm64 as well as amd64, so the images also run natively on Apple silicon.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: 0.1.0, 0.1 and latest. Also adds the OCI labels; the "source" label
      # is what links the package to this repository on GitHub.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/shubhamx57/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
