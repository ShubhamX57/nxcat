name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nxcat
          POSTGRES_PASSWORD: nxcat
          POSTGRES_DB: nxcat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nxcat -d nxcat_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      NXCAT_TEST_DATABASE_URL: postgresql+psycopg://nxcat:nxcat@localhost:5432/nxcat_test
      NXCAT_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov --cov-report=term-missing
