name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nxcat
          POSTGRES_PASSWORD: nxcat
          POSTGRES_DB: nxcat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nxcat -d nxcat_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      NXCAT_TEST_DATABASE_URL: postgresql+psycopg://nxcat:nxcat@localhost:5432/nxcat_test
      NXCAT_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    # Builds both images and runs the whole stack the way a user would.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start database, API and web app
        run: docker compose up -d --build --wait
      - name: Generate and ingest synthetic data inside the API container
        run: |
          docker compose exec -T api nxcat-generate --out /data/generated -n 20 --with-broken
          docker compose exec -T api nxcat-ingest /data/generated | tee ingest.log
          grep "added 20, updated 0, unchanged 0, failed 5" ingest.log
      - name: Check the API answers
        run: |
          curl --fail --silent http://localhost:8000/api/v1/health
          test "$(curl --fail --silent 'http://localhost:8000/api/v1/datasets?size=1' | python3 -c 'import json,sys; print(json.load(sys.stdin)["total"])')" = "20"
      - name: Check the web app and its API proxy
        run: |
          curl --fail --silent http://localhost:8080/ | grep -q "<title>nxcat</title>"
          curl --fail --silent http://localhost:8080/datasets/1 | grep -q "<title>nxcat</title>"
          test "$(curl --fail --silent 'http://localhost:8080/api/v1/datasets?size=1' | python3 -c 'import json,sys; print(json.load(sys.stdin)["total"])')" = "20"
          curl --fail --silent --head http://localhost:8080/ | grep -qi "content-security-policy"
      - name: Check write actions are off without login settings (secure default)
        run: |
          test "$(curl --silent -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"folder":"generated"}' http://localhost:8000/api/v1/ingest)" = "503"
      - name: Check plain-English search is off without a model (and says so)
        run: |
          test "$(curl --silent -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"question":"LET runs"}' http://localhost:8080/api/v1/search/ask)" = "503"
      - name: Show logs if anything failed
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v
